name: CI

# Pull requests only: main changes only through pull requests that pass this workflow
# (see the ruleset in infra/github.tf), so running it again after a merge repeats the work.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the pull request touches anything the checks cover. Changes only to
  # docs, Markdown, infra/ or the Infrastructure workflow skip `check`; a job skipped this
  # way still counts as passed for the ruleset's required check (a skipped workflow wouldn't).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          echo "$changed"
          if echo "$changed" | grep -qvE '^(docs/|infra/|\.github/workflows/infra\.yml$)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:19.0
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      # Test-only token signing for API and end-to-end tests (never set in production).
      AUTH_TEST_SECRET: ci-only-test-secret-0123456789abcdefghij
      PRISMA_DISABLE_TELEMETRY: '1'
      STORYBOOK_DISABLE_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (TypeScript 7)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Check the emitted Prisma contract is committed
        run: |
          pnpm --filter @app/db emit
          git diff --exit-code -- packages/db/src
          pnpm --filter @app/db migration:check

      # Chromium for Storybook story tests (part of `pnpm test`) and end-to-end tests.
      - name: Install Playwright browser
        run: pnpm --filter @app/e2e exec playwright install --with-deps chromium

      # API tests apply all migrations to the test database first.
      - name: Test
        run: pnpm test

      - name: Check migrations match the contract
        run: pnpm --filter @app/db verify

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload end-to-end report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/screenshots
          retention-days: 7

      - name: Build web
        run: pnpm --filter @app/web build

      - name: Build Storybook
        run: pnpm --filter @app/web build-storybook --quiet
